<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#05050c;display:flex;align-items:center;
    justify-content:center;overflow:hidden;font-family:'Courier New',monospace;}
  #wrap{position:relative;width:min(100vw,177.78vh);aspect-ratio:960/540;
    box-shadow:0 0 80px rgba(90,130,255,.25),0 0 0 1px rgba(120,150,255,.15);
    border-radius:8px;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
"use strict";
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 960, H = 540;
cvs.width = W; cvs.height = H;
ctx.imageSmoothingEnabled = false;

var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var rectHit = function(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; };

/*__LEVEL_DATA__*/

var solids = staticSolids.concat(movers);

/* ---------------- 音效 ---------------- */
var audioCtx = null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

/* ---------------- 输入 ---------------- */
var keys = {};
var mouse = { x: W*0.8, y: H/2, down: false };

window.addEventListener('keydown', function(e){
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='Space' || e.code==='KeyW' || e.code==='ArrowUp') player.jumpBuffer = 8;
    if(e.code === 'KeyR' && state.mode === 'play') killPlayer();
  }
  keys[e.code] = true;
  initAudio();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for(var k in keys) keys[k] = false; mouse.down = false; });

cvs.addEventListener('mousemove', function(e){
  var r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mousedown', function(e){ mouse.down = true; initAudio(); e.preventDefault(); });
window.addEventListener('mouseup', function(){ mouse.down = false; });
cvs.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------------- 状态 ---------------- */
var state = { mode: 'play', deaths: 0, camX: 0, shake: 0, deadTimer: 0, winTimer: 0, t: 0, spawn: { x: SPAWN.x, y: SPAWN.y } };
var player = { x: SPAWN.x, y: SPAWN.y, w: 14, h: 22, vx: 0, vy: 0, onGround: false, ground: null, jumpsLeft: 1, coyote: 0, jumpBuffer: 0, facing: 1, shootCd: 0, aimAngle: 0 };
var bullets = [], enemyBullets = [], particles = [];

/* ---------------- 粒子 ---------------- */
function addParticles(x, y, n, color, spd, life){
  life = life || 30;
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var s = rnd(spd*0.3, spd);
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: rnd(life*0.5, life), maxLife: life, color: color, size: rnd(1.5, 3.5) });
  }
}
function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.97; p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
}

/* ---------------- 物理 ---------------- */
function moveEntity(e, list){
  e.x += e.vx;
  for(var i=0;i<list.length;i++){
    var s = list[i];
    if(rectHit(e, s)){
      if(e.vx > 0) e.x = s.x - e.w; else if(e.vx < 0) e.x = s.x + s.w;
      e.vx = 0;
    }
  }
  e.y += e.vy; e.onGround = false; e.ground = null;
  for(var j=0;j<list.length;j++){
    var t = list[j];
    if(rectHit(e, t)){
      if(e.vy >= 0){ e.y = t.y - e.h; e.vy = 0; e.onGround = true; e.ground = t; }
      else { e.y = t.y + t.h; e.vy = 0; }
    }
  }
}

/* ---------------- 移动平台 ---------------- */
function updateMovers(){
  for(var i=0;i<movers.length;i++){
    var m = movers[i];
    var px = m.x, py = m.y;
    m.phase += m.spd;
    m.x = m.ox + Math.sin(m.phase) * m.ax;
    m.y = m.oy + Math.sin(m.phase) * m.ay;
    m.dx = m.x - px; m.dy = m.y - py;
    if(player.onGround && player.ground === m && state.mode === 'play'){ player.x += m.dx; player.y += m.dy; }
  }
}

/* ---------------- 玩家 ---------------- */
function updatePlayer(){
  var p = player;
  var ax = 0;
  if(keys['ArrowLeft'] || keys['KeyA']) ax--;
  if(keys['ArrowRight']|| keys['KeyD']) ax++;
  if(ax !== 0){ p.vx += ax * 1.25; p.facing = ax; }
  else { p.vx *= 0.78; if(Math.abs(p.vx) < 0.15) p.vx = 0; }
  p.vx = clamp(p.vx, -4.6, 4.6);

  p.vy += 0.62;
  if(p.vy > 15) p.vy = 15;

  moveEntity(p, solids);

  if(p.onGround){ p.jumpsLeft = 1; p.coyote = 8; }
  else if(p.coyote > 0) p.coyote--;
  if(p.jumpBuffer > 0) p.jumpBuffer--;

  if(p.jumpBuffer > 0){
    if(p.onGround || p.coyote > 0){
      p.vy = -11.6; p.jumpsLeft = 1; p.coyote = 0; p.onGround = false; p.jumpBuffer = 0;
      addParticles(p.x + p.w/2, p.y + p.h, 6, '#5eead4', 2.5, 18);
      beep(430, 0.07, 'square', 0.018);
    } else if(p.jumpsLeft > 0){
      p.vy = -10.2; p.jumpsLeft = 0; p.jumpBuffer = 0;
      addParticles(p.x + p.w/2, p.y + p.h, 12, '#a78bfa', 4, 22);
      beep(680, 0.08, 'square', 0.018);
    }
  }

  var wmx = mouse.x + state.camX;
  p.aimAngle = Math.atan2(mouse.y - (p.y + p.h/2), wmx - (p.x + p.w/2));

  if(p.shootCd > 0) p.shootCd--;
  if((mouse.down || keys['KeyJ']) && p.shootCd <= 0){ shoot(); p.shootCd = 9; }

  checkHazards();
}

/* ---------------- 射击 ---------------- */
function shoot(){
  var p = player, a = p.aimAngle;
  var cx = p.x + p.w/2 + Math.cos(a)*14;
  var cy = p.y + p.h/2 + Math.sin(a)*14;
  bullets.push({ x: cx, y: cy, vx: Math.cos(a)*14, vy: Math.sin(a)*14, life: 80 });
  p.vx -= Math.cos(a) * 0.6;
  addParticles(cx, cy, 4, '#fde047', 3, 12);
  state.shake = Math.max(state.shake, 2.2);
  beep(900 + rnd(-60,60), 0.045, 'square', 0.012);
}

/* ---------------- 子弹 ---------------- */
function updateBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    var hit = b.life <= 0;
    if(!hit){
      for(var k=0;k<solids.length;k++){
        var s = solids[k];
        if(b.x > s.x && b.x < s.x+s.w && b.y > s.y && b.y < s.y+s.h){ hit = true; break; }
      }
    }
    if(!hit){
      for(var m=0;m<enemies.length;m++){
        var e = enemies[m];
        if(!e.alive) continue;
        if(b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h){
          e.alive = false; hit = true;
          addParticles(b.x, b.y, 16, '#f59e0b', 5.5, 30);
          addParticles(b.x, b.y, 8, '#fde047', 3.5, 20);
          state.shake = 8;
          beep(260, 0.13, 'sawtooth', 0.03);
          break;
        }
      }
    }
    if(hit) bullets.splice(i,1);
  }

  for(var n=enemyBullets.length-1;n>=0;n--){
    var eb = enemyBullets[n];
    eb.x += eb.vx; eb.y += eb.vy; eb.life--;
    var ehit = eb.life <= 0;
    if(!ehit){
      for(var q=0;q<solids.length;q++){
        var ss = solids[q];
        if(eb.x > ss.x && eb.x < ss.x+ss.w && eb.y > ss.y && eb.y < ss.y+ss.h){ ehit = true; break; }
      }
    }
    if(!ehit && state.mode === 'play'){
      if(rectHit({x:eb.x-3,y:eb.y-3,w:6,h:6}, player)){ ehit = true; killPlayer(); }
    }
    if(ehit) enemyBullets.splice(n,1);
  }
}

/* ---------------- 敌人 ---------------- */
function updateEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(!e.alive) continue;

    if(e.type === 'walker'){
      e.x += e.vx;
      if(e.x < e.minX){ e.x = e.minX; e.vx *= -1; }
      if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx *= -1; }
    }
    else if(e.type === 'shooter'){
      e.phase += 0.05;
      e.y = e.baseY + Math.sin(e.phase) * 14;
      e.cd--;
      if(e.cd <= 0 && state.mode === 'play'){
        var dx = (player.x + player.w/2) - (e.x + e.w/2);
        var dy = (player.y + player.h/2) - (e.y + e.h/2);
        var d = Math.hypot(dx, dy) || 1;
        if(d < 540){
          var sp = 4.2;
          enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h/2, vx: dx/d*sp, vy: dy/d*sp, life: 220 });
          e.cd = 95;
          beep(200, 0.1, 'sawtooth', 0.02);
        } else { e.cd = 25; }
      }
    }
  }
}

/* ---------------- 危险检测 ---------------- */
function checkHazards(){
  var p = player, i;
  for(i=0;i<spikes.length;i++){
    var s = spikes[i];
    if(rectHit(p, {x:s.x+3, y:s.y+7, w:s.w-6, h:s.h-7})){ killPlayer(); return; }
  }
  for(i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(!e.alive) continue;
    if(rectHit(p, {x:e.x+3, y:e.y+3, w:e.w-6, h:e.h-6})){ killPlayer(); return; }
  }
  if(p.y > H + 120){ killPlayer(); return; }

  for(i=0;i<checkpoints.length;i++){
    var c = checkpoints[i];
    if(!c.active && rectHit(p, c)){
      c.active = true;
      state.spawn = { x: c.spawnX, y: c.spawnY };
      addParticles(c.x + c.w/2, c.y + 10, 18, '#4ade80', 4, 36);
      beep(520, 0.1, 'sine', 0.03);
      setTimeout(function(){ beep(780, 0.12, 'sine', 0.03); }, 90);
    }
  }

  if(rectHit(p, goal)){
    state.mode = 'win'; state.winTimer = 0;
    addParticles(goal.x + goal.w/2, goal.y + goal.h/2, 40, '#fde047', 7, 50);
    beep(660,0.15,'sine',0.04);
    setTimeout(function(){ beep(880,0.15,'sine',0.04); }, 140);
    setTimeout(function(){ beep(1100,0.25,'sine',0.04); }, 280);
  }
}

/* ---------------- 死亡 / 重生 ---------------- */
function killPlayer(){
  if(state.mode !== 'play') return;
  state.mode = 'dead'; state.deadTimer = 28; state.deaths++; state.shake = 14;
  addParticles(player.x + player.w/2, player.y + player.h/2, 26, '#e94560', 6.5, 40);
  addParticles(player.x + player.w/2, player.y + player.h/2, 14, '#ffffff', 4, 24);
  beep(140, 0.28, 'sawtooth', 0.045);
}

function respawn(){
  player.x = state.spawn.x; player.y = state.spawn.y;
  player.vx = 0; player.vy = 0; player.jumpsLeft = 1;
  player.coyote = 0; player.jumpBuffer = 0;
  player.onGround = false; player.ground = null; player.shootCd = 0;
  enemyBullets.length = 0;
  state.mode = 'play';
  state.camX = clamp(player.x + player.w/2 - W/2, 0, WORLD_W - W);
  addParticles(player.x + player.w/2, player.y + player.h/2, 16, '#5eead4', 4, 28);
}

/* ---------------- 更新 ---------------- */
function update(){
  state.t++;
  updateMovers();

  if(state.mode === 'play') updatePlayer();
  else if(state.mode === 'dead'){
    state.deadTimer--;
    if(state.deadTimer <= 0) respawn();
  } else if(state.mode === 'win') state.winTimer++;

  updateBullets();
  updateEnemies();
  updateParticles();

  if(state.mode !== 'win'){
    var targetX = clamp(player.x + player.w/2 - W/2 + player.vx * 6, 0, WORLD_W - W);
    state.camX += (targetX - state.camX) * 0.12;
  }
  if(state.shake > 0.1) state.shake *= 0.87;
  else state.shake = 0;
}

/* ---------------- 渲染 ---------------- */
var stars = [];
for(var si=0;si<160;si++){
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.6 + 0.3, d: Math.random()*0.7 + 0.15, a: Math.random()*0.6 + 0.25 });
}

function drawBackground(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#07070f'); g.addColorStop(0.55,'#100e1e'); g.addColorStop(1,'#1c1330');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var x = s.x - state.camX * s.d;
    x = ((x % W) + W) % W;
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#9fb4ff';
    ctx.fillRect(x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  var mx = 780 - state.camX * 0.08;
  ctx.globalAlpha = 0.55;
  var mg = ctx.createRadialGradient(mx, 110, 10, mx, 110, 90);
  mg.addColorStop(0, 'rgba(160,180,255,0.45)');
  mg.addColorStop(1, 'rgba(160,180,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, 110, 90, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#20264a';
  ctx.beginPath(); ctx.arc(mx, 110, 42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2b3260';
  ctx.beginPath(); ctx.arc(mx - 14, 100, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 12, 124, 5, 0, Math.PI*2); ctx.fill();
}

function drawSolids(){
  for(var i=0;i<solids.length;i++){
    var s = solids[i];
    if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
    var isMover = movers.indexOf(s) >= 0;
    ctx.fillStyle = isMover ? '#3b2f5e' : '#242440';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = isMover ? '#8b6ee8' : '#4d4d7d';
    ctx.fillRect(s.x, s.y, s.w, 3);
    ctx.fillStyle = isMover ? '#a78bfa' : '#6a6aa8';
    ctx.fillRect(s.x, s.y, s.w, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
  }
}

function drawSpikes(){
  for(var i=0;i<spikes.length;i++){
    var s = spikes[i];
    if(s.x + s.w < state.camX - 120 || s.x > state.camX + W + 120) continue;
    var n = Math.max(1, Math.round(s.w / 14));
    var tw = s.w / n;
    for(var j=0;j<n;j++){
      var x = s.x + j*tw;
      ctx.beginPath();
      ctx.moveTo(x, s.y + s.h);
      ctx.lineTo(x + tw/2, s.y);
      ctx.lineTo(x + tw, s.y + s.h);
      ctx.closePath();
      ctx.fillStyle = '#e94560';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + tw/2, s.y);
      ctx.lineTo(x + tw*0.72, s.y + s.h);
      ctx.lineTo(x + tw/2, s.y + s.h);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,180,200,0.45)';
      ctx.fill();
    }
  }
}

function drawCheckpoints(){
  for(var i=0;i<checkpoints.length;i++){
    var c = checkpoints[i];
    if(c.x + c.w < state.camX - 120 || c.x > state.camX + W + 120) continue;
    ctx.fillStyle = c.active ? '#9aa4c0' : '#4a4a68';
    ctx.fillRect(c.x + c.w/2 - 2, c.y, 4, c.h);
    var wave = Math.sin(state.t * 0.08) * 3;
    ctx.beginPath();
    ctx.moveTo(c.x + c.w/2 + 2, c.y + 4);
    ctx.lineTo(c.x + c.w/2 + 24, c.y + 12 + wave);
    ctx.lineTo(c.x + c.w/2 + 2, c.y + 22);
    ctx.closePath();
    ctx.fillStyle = c.active ? '#4ade80' : '#3a3a55';
    ctx.fill();
    if(c.active){
      ctx.globalAlpha = 0.25 + Math.sin(state.t*0.1)*0.12;
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + 20, 22, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawGoal(){
  var g = goal;
  if(g.x + g.w < state.camX - 160 || g.x > state.camX + W + 160) return;
  var pulse = Math.sin(state.t * 0.09) * 0.5 + 0.5;
  var rg = ctx.createRadialGradient(g.x + g.w/2, g.y + g.h/2, 4, g.x + g.w/2, g.y + g.h/2, 70);
  rg.addColorStop(0, 'rgba(253,224,71,' + (0.35 + pulse*0.25) + ')');
  rg.addColorStop(1, 'rgba(253,224,71,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(g.x - 60, g.y - 60, g.w + 120, g.h + 120);
  ctx.fillStyle = '#fde047';
  ctx.fillRect(g.x, g.y, g.w, g.h);
  ctx.fillStyle = '#0b0b18';
  ctx.fillRect(g.x + 5, g.y + 5, g.w - 10, g.h - 5);
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.fillStyle = '#fef9c3';
  for(var i=0;i<4;i++) ctx.fillRect(g.x + 9, g.y + 14 + i*16, g.w - 18, 3);
  ctx.globalAlpha = 1;
}

function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(!e.alive) continue;
    if(e.x + e.w < state.camX - 120 || e.x > state.camX + W + 120) continue;

    if(e.type === 'walker'){
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#b45309';
      ctx.fillRect(e.x, e.y + e.h - 6, e.w, 6);
      ctx.fillStyle = '#1a0a00';
      var ex = e.vx > 0 ? e.x + e.w - 9 : e.x + 3;
      ctx.fillRect(ex, e.y + 8, 5, 5);
      ctx.fillStyle = '#fff7ed';
      ctx.fillRect(e.x + 5, e.y + e.h - 12, 3, 4);
      ctx.fillRect(e.x + e.w - 9, e.y + e.h - 12, 3, 4);
    }
    else if(e.type === 'shooter'){
      var cx = e.x + e.w/2, cy = e.y + e.h/2;
      var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 26);
      rg.addColorStop(0, 'rgba(233,69,96,0.5)');
      rg.addColorStop(1, 'rgba(233,69,96,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e94560';
      ctx.beginPath(); ctx.arc(cx, cy, e.w/2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a0a12';
      ctx.beginPath(); ctx.arc(cx, cy, e.w/4, 0, Math.PI*2); ctx.fill();
      var pulse = Math.sin(state.t*0.15)*0.5+0.5;
      ctx.fillStyle = 'rgba(255,220,120,' + (0.5+pulse*0.5) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, 3.5 + pulse*1.5, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fde047';
    ctx.fillRect(-14, -1.5, 14, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-3, -2.5, 8, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, -1.5, 4, 3);
    ctx.restore();
  }
  for(var j=0;j<enemyBullets.length;j++){
    var eb = enemyBullets[j];
    var rg = ctx.createRadialGradient(eb.x, eb.y, 0, eb.x, eb.y, 10);
    rg.addColorStop(0, 'rgba(255,120,160,1)');
    rg.addColorStop(1, 'rgba(233,69,96,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff6b8a';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 1.8, 0, Math.PI*2); ctx.fill();
  }
}

function drawPlayer(){
  var p = player;
  if(state.mode === 'dead'){
    var t = 1 - state.deadTimer / 28;
    ctx.globalAlpha = Math.max(0, 1 - t*1.4);
    ctx.fillStyle = '#e94560';
    ctx.fillRect(p.x - 4*t, p.y - 4*t, p.w + 8*t, p.h + 8*t);
    ctx.globalAlpha = 1;
    return;
  }
  if(state.mode === 'win') ctx.globalAlpha = 0.6 + Math.sin(state.t*0.3)*0.4;

  var cx = p.x + p.w/2, cy = p.y + p.h/2;
  var rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 24);
  rg.addColorStop(0, 'rgba(94,234,212,0.28)');
  rg.addColorStop(1, 'rgba(94,234,212,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.aimAngle);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(2, -2.5, 14, 5);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(12, -2, 5, 4);
  ctx.restore();

  ctx.fillStyle = '#5eead4';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeStyle = '#0d9488';
  ctx.lineWidth = 1;
  ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);

  ctx.fillStyle = '#062a26';
  if(p.facing >= 0){
    ctx.fillRect(p.x + p.w - 7, p.y + 5, 3, 4);
    ctx.fillRect(p.x + p.w - 3, p.y + 5, 2, 4);
  } else {
    ctx.fillRect(p.x + 2, p.y + 5, 3, 4);
    ctx.fillRect(p.x + 6, p.y + 5, 2, 4);
  }
  ctx.fillStyle = '#0d9488';
  ctx.fillRect(p.x - 1, p.y + p.h - 6, p.w + 2, 3);
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    var a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    var s = p.size * (0.4 + a * 0.6);
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawHUD(){
  ctx.fillStyle = 'rgba(10,10,20,0.65)';
  roundRect(14, 14, 152, 36, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(120,150,255,0.3)';
  ctx.lineWidth = 1;
  roundRect(14.5, 14.5, 151, 35, 6); ctx.stroke();

  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 16px "Courier New",monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('☠ 死亡', 26, 33);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText(('00' + state.deaths).slice(-3), 118, 33);

  ctx.fillStyle = 'rgba(160,180,220,0.55)';
  ctx.font = '13px "Courier New",monospace';
  ctx.textAlign = 'right';
  ctx.fillText('A/D 移动 · SPACE 跳跃(二段) · 鼠标射击 · R 重来', W - 18, 32);

  var prog = clamp(player.x / (goal.x || 1), 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(W/2 - 180, H - 22, 360, 5);
  ctx.fillStyle = '#5eead4';
  ctx.fillRect(W/2 - 180, H - 22, 360 * prog, 5);
  ctx.fillStyle = '#fde047';
  ctx.fillRect(W/2 + 177, H - 26, 6, 13);
  ctx.fillStyle = '#5eead4';
  ctx.beginPath();
  ctx.arc(W/2 - 180 + 360*prog, H - 19.5, 4, 0, Math.PI*2);
  ctx.fill();

  var mx = mouse.x, my = mouse.y;
  ctx.strokeStyle = 'rgba(253,224,71,0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mx - 15, my); ctx.lineTo(mx - 5, my);
  ctx.moveTo(mx + 5, my);  ctx.lineTo(mx + 15, my);
  ctx.moveTo(mx, my - 15); ctx.lineTo(mx, my - 5);
  ctx.moveTo(mx, my + 5);  ctx.lineTo(mx, my + 15);
  ctx.stroke();
}

function drawOverlay(){
  if(state.mode === 'dead'){
    var a = (state.deadTimer / 28) * 0.35;
    ctx.fillStyle = 'rgba(233,69,96,' + a + ')';
    ctx.fillRect(0,0,W,H);
  }
  if(state.mode === 'win'){
    var al = clamp(state.winTimer / 40, 0, 1);
    ctx.fillStyle = 'rgba(5,5,15,' + (0.72 * al) + ')';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = al;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var bounce = Math.sin(state.t * 0.08) * 6;
    ctx.font = 'bold 64px "Courier New",monospace';
    ctx.fillStyle = '#fde047';
    ctx.shadowColor = '#fde047'; ctx.shadowBlur = 30;
    ctx.fillText('YOU WIN!', W/2, H/2 - 60 + bounce);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 22px "Courier New",monospace';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('死亡次数: ' + state.deaths, W/2, H/2 + 20);
    ctx.font = '16px "Courier New",monospace';
    ctx.fillStyle = 'rgba(180,200,240,0.75)';
    ctx.fillText('刷新页面再来一次', W/2, H/2 + 62);
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  var sx = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;
  var sy = state.shake > 0.2 ? rnd(-state.shake, state.shake) : 0;

  ctx.save();
  ctx.translate(-Math.round(state.camX) + sx, sy);
  drawSolids();
  drawSpikes();
  drawCheckpoints();
  drawGoal();
  drawEnemies();
  drawBullets();
  drawPlayer();
  drawParticles();
  ctx.restore();

  drawHUD();
  drawOverlay();
}

/* ---------------- 主循环 ---------------- */
var lastTime = performance.now();
var accumulator = 0;
var STEP = 1000 / 60;

function loop(now){
  requestAnimationFrame(loop);
  var delta = now - lastTime;
  lastTime = now;
  if(delta > 100) delta = 100;
  accumulator += delta;
  var guard = 0;
  while(accumulator >= STEP && guard < 5){
    update();
    accumulator -= STEP;
    guard++;
  }
  if(guard >= 5) accumulator = 0;
  render();
}

state.camX = 0;
requestAnimationFrame(loop);

})();
</script>
</body>
