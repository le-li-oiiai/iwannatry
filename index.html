<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot · 关卡编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">🛠 I WANNA SHOOT · 关卡编辑器</div>
    <div id="top-actions">
      <button class="btn" id="btn-undo" title="Ctrl+Z">↶ 撤销</button>
      <button class="btn" id="btn-redo" title="Ctrl+Y">↷ 重做</button>
      <span class="sep"></span>
      <button class="btn" id="btn-fit">适应窗口</button>
      <span id="zoom-label">100%</span>
      <span class="sep"></span>
      <button class="btn primary" id="btn-test">▶ 测试游玩</button>
      <button class="btn" id="btn-export">导出 HTML</button>
      <button class="btn" id="btn-save">保存 JSON</button>
      <button class="btn" id="btn-load">加载 JSON</button>
    </div>
  </header>

  <main>
    <aside id="left">
      <div class="panel-title">工具</div>
      <div id="tools"></div>

      <div class="panel-title">吸附</div>
      <label class="row"><input type="checkbox" id="snap-toggle" checked> 网格吸附</label>
      <label class="row">网格 <input type="number" id="grid-size" min="1" max="200" step="1" value="10"></label>

      <div class="panel-title">世界设置</div>
      <label class="row">宽 <input type="number" id="world-w" min="400" max="20000" step="100"></label>
      <label class="row">高 <input type="number" id="world-h" min="200" max="3000" step="20"></label>
      <label class="row">出生X <input type="number" id="spawn-x" step="1"></label>
      <label class="row">出生Y <input type="number" id="spawn-y" step="1"></label>
    </aside>

    <div id="center">
      <canvas id="cv"></canvas>
      <div id="hint">滚轮缩放 · 中键 / 空格+拖拽 平移 · Delete 删除</div>
    </div>

    <aside id="right">
      <div class="panel-title">属性</div>
      <div id="inspector"></div>
      <div class="panel-title">对象列表</div>
      <div id="objlist"></div>
    </aside>
  </main>
</div>

<div id="test-overlay" class="hidden">
  <div id="test-bar">
    <span class="ttl">▶ 测试游玩</span>
    <span class="hint">A/D 移动 · 空格跳跃(二段) · 鼠标射击 · R 重来</span>
    <button class="btn" id="btn-close-test" style="margin-left:auto">✕ 关闭</button>
  </div>
  <iframe id="test-frame"></iframe>
</div>

<script src="js/editor.js"></script>
</body>
</html>
